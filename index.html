<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gemini AI Insights</title>
</head>
<body>
  <p id="msg">Loading...</p>
  <script src="https://cdn.jsdelivr.net/npm/tableau.extensions.api@1/lib/tableau.extensions.1.latest.min.js"></script>
  <script>
    var msg = document.getElementById("msg");
    msg.textContent = "Script loaded. tableau defined: " + (typeof tableau !== "undefined");

    if (typeof tableau !== "undefined") {
      msg.textContent = "Calling initializeAsync...";
      tableau.extensions.initializeAsync().then(function() {
        msg.textContent = "SUCCESS: " + tableau.extensions.dashboardContent.dashboard.name;
      }).catch(function(e) {
        msg.textContent = "CATCH: " + e.message;
      });
    } else {
      msg.textContent = "FAIL: tableau is not defined";
    }
  </script>
</body>
</html>
